
name: My First Workflow

on:
  push:
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Print message
        run: echo "Hello Anuradha!"

      - name: Step 2 - Check current directory
        run: pwd

      - name: Step 3 - List files
        run: ls -la

      - name: Step 4 - Check operating system
        run: uname -a
