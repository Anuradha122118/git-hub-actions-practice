
name: My First Workflow

on:
  push:
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print message
        run: echo "Hello Anuradha!"

      - name: Show current directory
        run: pwd

      - name: List repository files
        run: ls -la

      - name: Display README
        run: cat README.md
