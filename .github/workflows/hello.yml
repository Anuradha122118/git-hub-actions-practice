name: GitHub Actions Practice

on:
  push:
    branches:
      - main

jobs:
  demo:
    runs-on: ubuntu-latest

    env:
      APP_NAME: myapp
      ENVIRONMENT: testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display environment variables
        run: |
          echo "Application: $APP_NAME"
          echo "Environment: $ENVIRONMENT"
